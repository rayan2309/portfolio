# Politique de cache selon le type de contenu.
# CSS et JS sont versionnés par le build (?v=sha-...) : cache long et immuable.
# Le reste (HTML, favicon) : no-cache, toujours revalidé, donc toujours la bonne version des assets.
map $sent_http_content_type $cache_control {
    default                   "no-cache";
    ~*text/css                "public, max-age=31536000, immutable";
    ~*javascript              "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # En-têtes de sécurité. Le site n'utilise ni ressource externe, ni script ou style en ligne.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;

    location / {
        try_files $uri $uri/ =404;
    }


    # Sonde de santé pour Kubernetes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
