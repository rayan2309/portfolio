name: Build et publication de l'image

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "argocd/**"
      - "README.md"

permissions:
  contents: write   # pour committer le nouveau tag dans k8s/kustomization.yaml
  packages: write   # pour publier l'image sur GHCR

env:
  IMAGE: ghcr.io/rayan2309/portfolio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          # Version injectée dans les liens des assets (voir Dockerfile).
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}

      # GitOps : le dépôt reste la source de vérité. On écrit le tag déployé dans Git,
      # et Argo CD détecte le changement. Un push fait avec GITHUB_TOKEN ne relance pas ce workflow.
      - name: Mettre à jour le tag dans kustomization.yaml
        run: |
          sed -i "s|newTag: .*|newTag: ${{ steps.meta.outputs.tag }}|" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: déploie ${{ steps.meta.outputs.tag }}"
          git push
